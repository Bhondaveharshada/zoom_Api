<!-- Button to open the modal -->
<button class="btn btn-primary" (click)="openModal()">Create Meeting</button>

<!-- Modal structure -->
<div class="modal" tabindex="-1" #modal>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Create Meeting</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <form>
          <!-- Topic -->
          <div class="form-group">
            <label for="topic">Meeting Topic</label>
            <input type="text" id="topic" class="form-control" [(ngModel)]="meetingData.topic" name="topic">
          </div>
          
          <!-- Meeting Type (Only Scheduled Meeting) -->
          <div class="form-group">
            <label for="meetingType">Type</label>
            <select id="meetingType" class="form-control" [(ngModel)]="meetingData.type" name="type" [disabled]="true">
              <option [value]="2">Scheduled Meeting</option>
            </select>
          </div>

          <!-- Start Time -->
          <div class="form-group">
            <label for="startTime">Start Time</label>
            <input type="datetime-local" id="startTime" class="form-control" [(ngModel)]="meetingData.start_time" name="start_time" required>
          </div>

          <!-- Duration -->
          <div class="form-group">
            <label for="duration">Duration (minutes)</label>
            <input type="number" id="duration" class="form-control" [(ngModel)]="meetingData.duration" name="duration" required>
          </div>

          <!-- Timezone -->
          <div class="form-group">
            <label for="timezone">Timezone</label>
            <input type="text" id="timezone" class="form-control" [(ngModel)]="meetingData.timezone" name="timezone" required>
          </div>

          <!-- Agenda -->
          <div class="form-group">
            <label for="agenda">Agenda</label>
            <textarea id="agenda" class="form-control" [(ngModel)]="meetingData.agenda" name="agenda"></textarea>
          </div>

        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
        <button type="button" class="btn btn-primary" (click)="createMeeting()">Create Meeting</button>
      </div>
    </div>
  </div>
</div>

<table class="table table-striped overflow-auto">
  <thead>
    <tr>
      <th>Meeting Topic</th>
      <th>Meeting ID</th>
      <th colspan="2">Start Time</th>
      <th colspan="2">Agenda</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let meeting of meetings">
      <td>{{ meeting.topic }}</td>
      <td>{{ meeting.id }}</td>
      <td colspan="2">{{ meeting.start_time }}</td>
      <td colspan="2">{{ meeting.agenda }}</td>
      <td>
        <button class="btn btn-success" (click)="startHostMeeting(meeting.id, meeting.password)">Start</button>
        <button class="btn btn-danger" (click)="endMeeting(meeting.id)">End</button>
      </td>
    </tr>
  </tbody>
</table>
